name: ZTE H168N Build Automation

on:
  push:
    branches: [ main ]

jobs:
  build_firmware:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout wrapper repository
      uses: actions/checkout@v4

    - name: Install Essential OpenWrt Linux Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc \
          gettext git libncurses5-dev libssl-dev python3-setuptools rsync \
          swig unzip zlib1g-dev file wget time libelf-dev

    # FIX: Automatically strips hidden Windows carriage returns (\r) from your script
    - name: Standardize Script Line Endings for Linux
      run: |
        sed -i 's/\r$//' ./build.sh
        chmod +x ./build.sh

    - name: Execute OpenWrt Compilation
      run: ./build.sh

    - name: Verify Output Firmware Binary
      id: check_output
      run: |
        FILE="./openwrt/bin/targets/econet/en751221/openwrt-econet-en751221-zte_zxhn-h168n-v35-initramfs-kernel.bin"
        if [ -f "$FILE" ]; then
          echo "Firmware compilation successful!"
          echo "file_exists=true" >> $GITHUB_OUTPUT
        else
          echo "ERROR: Target firmware binary not found!"
          echo "file_exists=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Upload Compiled Firmware Asset
      if: steps.check_output.outputs.file_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: zte-h168n-v35-openwrt-initramfs
        path: ./openwrt/bin/targets/econet/en751221/openwrt-econet-en751221-zte_zxhn-h168n-v35-initramfs-kernel.bin
        retention-days: 7
